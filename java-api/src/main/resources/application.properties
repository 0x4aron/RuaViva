spring.application.name=zeladoria-api

# Porta: o Render informa a porta pela variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Conexao com o Oracle. Os valores vem de variaveis de ambiente,
# assim nenhuma senha fica salva no codigo nem no GitHub.
#   DB_URL      ex.: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
#   DB_USER     ex.: rm000000
#   DB_PASSWORD senha do Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Poucas conexoes: o servidor da FIAP e compartilhado e o plano gratuito do Render e pequeno
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Mensagens de erro: o tratamento fica na classe GlobalExceptionHandler
server.error.include-stacktrace=never

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# O Render atende por HTTPS na frente da aplicacao; isto faz o Swagger usar o endereco certo
server.forward-headers-strategy=framework

# Menos threads = menos memoria (o plano gratuito do Render tem 512 MB)
server.tomcat.threads.max=20
