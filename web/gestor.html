<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila de trabalho | RuaViva</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header id="cabecalho"></header>
<main id="conteudo" class="pagina pagina-larga" tabindex="-1">
  <div id="aviso" class="aviso" hidden tabindex="-1" role="status" aria-live="polite"></div>
  <h1>Fila de trabalho</h1><p id="resumo" class="resumo-fila" aria-live="polite"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#relogio"></use></svg> Carregando fila e visitas…</p>
  <div class="colunas gestor-grade"><section aria-labelledby="titulo-fila"><h2 id="titulo-fila">Fila</h2>
    <div class="lista"><div class="fila-cabecalho" aria-hidden="true"><span>Prioridade</span><span>Problema</span><span>Endereço</span><span>Apoios</span><span>Aberto há / prazo</span><span>Ação</span></div>
    <div id="fila" role="list" aria-live="polite"><p class="carregando"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#relogio"></use></svg>Carregando…</p></div></div>
    </section><section aria-labelledby="titulo-visitas"><h2 id="titulo-visitas">Visitas agendadas</h2>
    <ul id="andamento" class="lista" aria-live="polite"><li class="carregando"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#relogio"></use></svg>Carregando…</li></ul></section></div>
</main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pagina-gestor.js"></script>
</body>
</html>
