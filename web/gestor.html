<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila de trabalho | {app}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="pagina pagina-larga">
    <div id="aviso" class="aviso" hidden tabindex="-1"></div>

    <h1>Fila de trabalho</h1>
    <p class="texto-suave">A ordem considera a gravidade do problema, quantos moradores apoiaram, se está perto de escola, UBS ou casa de repouso, e se quem registrou é idoso ou pessoa com deficiência.</p>

    <div class="colunas">
      <section aria-labelledby="titulo-fila">
        <h2 id="titulo-fila">Aguardando equipe</h2>
        <ul class="lista" id="fila"><li>Carregando...</li></ul>
      </section>

      <section aria-labelledby="titulo-andamento">
        <h2 id="titulo-andamento">Visitas agendadas</h2>
        <ul class="lista" id="andamento"><li>Carregando...</li></ul>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    sessao.exigir("gestor");
    montarCabecalho(LINKS_GESTOR("fila"));

    let apoio, equipes, apoiosPorOcorrencia, equipePorId;

    function hoje() {
      // Data local no formato AAAA-MM-DD (para o campo de data)
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function textoApoios(n) {
      return n === 0 ? "Nenhum apoio" : n === 1 ? "1 apoio" : `${n} apoios`;
    }

    function cabecalhoItem(o) {
      const categoria = apoio.categoria[o.idCategoria];
      const nivel = nivelPrioridade(o.prioridade);
      const dias = diasDesde(o.dataAbertura);
      const atrasado = dias > categoria.prazoDias;
      return `
        <div class="item-topo">
          <span class="prioridade ${nivel.classe}"><span class="prioridade-valor">${o.prioridade}</span> ${nivel.texto}</span>
          ${placaDeRua(o)}
        </div>
        <p class="item-categoria"><a href="ocorrencia.html?id=${o.idOcorrencia}">${esc(categoria.nome)}</a></p>
        <p class="item-meta">${esc(o.descricao)}</p>
        <p class="item-meta">${textoApoios(apoiosPorOcorrencia[o.idOcorrencia] || 0)}.
          Aberto há ${dias} dias${atrasado ? `, <strong style="color:var(--lanterna)">passou do prazo de ${categoria.prazoDias} dias</strong>` : ` (prazo: ${categoria.prazoDias} dias)`}.</p>`;
    }

    function desenharFila(fila) {
      const opcoesEquipe = equipes.map((e) => `<option value="${e.idEquipe}">${esc(e.nome)}</option>`).join("");
      document.getElementById("fila").innerHTML = fila.length ? fila.map((o) => `
        <li class="item">
          ${cabecalhoItem(o)}
          <form class="form-inline" data-agendar="${o.idOcorrencia}">
            <label for="equipe-${o.idOcorrencia}">Equipe</label>
            <select id="equipe-${o.idOcorrencia}" name="equipe">${opcoesEquipe}</select>
            <label for="data-${o.idOcorrencia}">Dia da visita</label>
            <input id="data-${o.idOcorrencia}" name="data" type="date" value="${hoje()}" min="${o.dataAbertura}" required>
            <button class="botao botao-principal" type="submit">Agendar visita</button>
          </form>
        </li>`).join("")
        : '<li class="vazio">Nenhum problema esperando equipe. Bom trabalho!</li>';
    }

    function desenharAndamento(lista, agendados) {
      document.getElementById("andamento").innerHTML = lista.length ? lista.map((o) => {
        const visita = agendados.find((a) => a.idOcorrencia === o.idOcorrencia);
        return `
        <li class="item">
          ${cabecalhoItem(o)}
          ${visita ? `
            <p><strong>${esc(equipePorId[visita.idEquipe]?.nome || "Equipe")}</strong>, dia ${formatarData(visita.dataAgendada)}</p>
            <form class="form-inline" data-concluir="${visita.idAtendimento}">
              <label for="obs-${visita.idAtendimento}">O que foi feito (opcional)</label>
              <input id="obs-${visita.idAtendimento}" name="observacao" maxlength="500">
              <div class="acoes">
                <button class="botao botao-principal" type="submit">Marcar como resolvido</button>
                <button class="botao botao-perigo" type="button" data-cancelar="${visita.idAtendimento}">Cancelar visita</button>
              </div>
            </form>` : ""}
        </li>`;
      }).join("")
        : '<li class="vazio">Nenhuma visita agendada no momento.</li>';
      // Guarda os atendimentos para usar nos botoes
      document.getElementById("andamento").agendados = agendados;
    }

    async function carregar() {
      const [a, todasEquipes, fila, andamento, atendimentos, apoios] = await Promise.all([
        carregarApoio(),
        api.get("/equipes"),
        api.get("/ocorrencias/fila"),
        api.get("/ocorrencias?status=EM_ANDAMENTO"),
        api.get("/atendimentos"),
        api.get("/apoios"),
      ]);
      apoio = a;
      equipes = todasEquipes.filter((e) => e.ativa);
      equipePorId = Object.fromEntries(todasEquipes.map((e) => [e.idEquipe, e]));
      apoiosPorOcorrencia = {};
      apoios.forEach((x) => (apoiosPorOcorrencia[x.idOcorrencia] = (apoiosPorOcorrencia[x.idOcorrencia] || 0) + 1));

      desenharFila(fila);
      desenharAndamento(andamento, atendimentos.filter((x) => x.status === "AGENDADO"));
    }

    // Agendar visita (formularios da fila)
    document.getElementById("fila").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      form.querySelector("button").disabled = true;
      try {
        await api.post("/atendimentos", {
          idOcorrencia: Number(form.dataset.agendar),
          idEquipe: Number(form.equipe.value),
          dataAgendada: form.data.value,
        });
        avisar("Visita agendada. O morador já vê que a equipe está a caminho.");
        await carregar();
      } catch (erro) {
        avisarErro(erro);
        form.querySelector("button").disabled = false;
      }
    });

    // Concluir visita
    document.getElementById("andamento").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const visita = document.getElementById("andamento").agendados.find((a) => a.idAtendimento === Number(form.dataset.concluir));
      try {
        await api.put(`/atendimentos/${visita.idAtendimento}`, {
          ...visita,
          status: "CONCLUIDO",
          dataExecucao: hoje(),
          observacao: form.observacao.value.trim() || null,
        });
        avisar("Problema marcado como resolvido.");
        await carregar();
      } catch (erro) {
        avisarErro(erro);
      }
    });

    // Cancelar visita
    document.getElementById("andamento").addEventListener("click", async (e) => {
      const id = e.target.dataset.cancelar;
      if (!id) return;
      if (!confirm("Cancelar esta visita? O problema volta para a fila.")) return;
      const visita = document.getElementById("andamento").agendados.find((a) => a.idAtendimento === Number(id));
      try {
        await api.put(`/atendimentos/${id}`, { ...visita, status: "CANCELADO" });
        avisar("Visita cancelada. O problema voltou para a fila.");
        await carregar();
      } catch (erro) {
        avisarErro(erro);
      }
    });

    carregar().catch(avisarErro);
  </script>
</body>
</html>
