<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus registros | RuaViva</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header id="cabecalho"></header>
<main id="conteudo" class="pagina" tabindex="-1">
  <div id="aviso" class="aviso" hidden tabindex="-1" role="status" aria-live="polite"></div>
  <h1>Meus registros</h1>
  <section aria-labelledby="titulo-meus"><h2 id="titulo-meus">Problemas que eu registrei</h2><ul id="lista" class="lista" aria-live="polite"><li class="carregando">Carregando…</li></ul></section>
  <section aria-labelledby="titulo-apoiados"><h2 id="titulo-apoiados">Problemas que eu apoiei</h2><ul id="apoiados" class="lista" aria-live="polite"><li class="carregando">Carregando…</li></ul></section>
  <form id="buscar-registro" class="bloco formulario-acompanhamento acompanhar-fim" novalidate>
    <h2>Acompanhar um registro pelo número</h2>
    <div class="campo"><label for="numero-registro">Número do registro</label><p id="numero-registro-dica" class="dica">Digite os números exibidos depois de “Registro nº”.</p>
      <input id="numero-registro" name="numero" type="text" inputmode="numeric" pattern="[0-9]{1,12}" maxlength="12" required aria-describedby="numero-registro-dica" placeholder="Ex.: 0003"></div>
    <button id="acompanhar-registro" class="botao" type="submit">Acompanhar registro</button>
  </form>
</main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pagina-minhas.js"></script>
</body>
</html>
