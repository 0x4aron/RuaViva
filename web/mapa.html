<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Problemas no bairro | RuaViva</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header id="cabecalho"></header>
<main id="conteudo" class="pagina pagina-larga" tabindex="-1">
  <div id="aviso" class="aviso" hidden tabindex="-1" role="status" aria-live="polite"></div>
  <h1>Problemas no bairro</h1><p id="resumo" aria-live="polite"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#relogio"></use></svg> Carregando problemas da Liberdade…</p>
  <div class="segmentos" id="filtros" role="group" aria-label="Filtrar problemas">
    <button type="button" data-filtro="pendentes" aria-pressed="true">Pendentes</button>
    <button type="button" data-filtro="RESOLVIDA" aria-pressed="false">Resolvidos</button>
    <button type="button" data-filtro="todos" aria-pressed="false">Todos</button>
  </div>
  <div class="segmentos alternancia" id="alternancia" role="group" aria-label="Visualização">
    <button type="button" data-vista="lista" aria-pressed="true" aria-controls="lista-painel">Lista</button>
    <button type="button" data-vista="mapa" aria-pressed="false" aria-controls="mapa-painel">Mapa</button>
  </div>
  <div class="bairro-grade"><section id="lista-painel" class="lista-painel" aria-labelledby="titulo-lista"><h2 id="titulo-lista">Registros do bairro</h2>
    <ul class="lista" id="lista" aria-live="polite"><li class="carregando"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#relogio"></use></svg>Carregando…</li></ul></section>
    <section id="mapa-painel" class="mapa-painel" aria-labelledby="titulo-mapa" hidden><h2 id="titulo-mapa">Liberdade no mapa</h2>
      <div id="mapa" class="mapa" role="region" aria-label="Mapa dos problemas; os números correspondem à lista"></div>
      <p class="legenda"><span style="--cor:var(--lanterna)">Aberto</span><span style="--cor:var(--andamento)">Em andamento</span><span style="--cor:var(--resolvido)">Resolvido</span><span style="--cor:var(--asfalto-suave)">Cancelado</span></p>
    </section></div>
</main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/pagina-mapa.js"></script>
</body>
</html>
